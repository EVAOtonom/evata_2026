amcl:
  ros__parameters:
    use_sim_time: false
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.3
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.3
    alpha5: 0.0
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    tf_broadcast: false
    transform_tolerance: 0.5
    laser_model_type: likelihood_field
    laser_max_range: 100.0
    laser_min_range: 2.0
    laser_likelihood_max_dist: 1.0
    z_hit: 0.85
    z_rand: 0.5
    z_max: 0.03
    z_short: 0.02
    sigma_hit: 0.15
    lambda_short: 0.05
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    min_particles: 100
    max_particles: 3000
    resample_interval: 3
    pf_err: 0.03
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    update_min_d: 0.2
    update_min_a: 0.15
    set_initial_pose: false
    always_reset_initial_pose: false
    save_pose_rate: 0.05
