amcl:
  ros__parameters:
    use_sim_time: False

    ### Hareket modeli ###
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.3   # Yaw dönüş gürültüsü - düşük tuttum, tekerlek odometride güven varsa
    alpha2: 0.1   # Velocity’den dönüş gürültüsü - makul düşük
    alpha3: 0.1   # Translation (ilerleme) gürültüsü - düşük, tekerlek odometriye güven
    alpha4: 0.3   # Rotation’dan translasyon gürültüsü - düşük
    alpha5: 0.0   # Kullanılmıyor

    ### Frame Ayarları ###
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    tf_broadcast: true
    transform_tolerance: 0.5

    ### Lazer modeli ###
    #scan_topic: scan
    laser_model_type: "likelihood_field"
    laser_max_range: 100.0    # Gerçek lidar max menzilin   #70 yaparak da dene
    laser_min_range: 2.0
    laser_likelihood_max_dist: 1.0   # 2.0’den biraz daha yüksek, çünkü uzak mesafelerde tolerans artmalı
    z_hit: 0.85                    # Güven artırıldı, lidar uzun menzilli ve temizse
    z_rand: 0.50                   # Rastgele ölçüm (gürültü) olasılığı biraz düşürüldü
    z_max: 0.03                   # Çok uzak ve yanlış ölçümlere düşük ağırlık
    z_short: 0.02                 # Ani kısa mesafe hatalarına düşük ağırlık
    sigma_hit: 0.15               # Ölçüm gürültüsü standart sapması azaldı, lidar kaliteliysa
    lambda_short: 0.05            # Kısa mesafe model parametresi

    ### Beam skip ayarları ###
    do_beamskip: true            # Kapalı bırak, sorun yaşarsan aç
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    ### Parçacık filtre ayarları ###
    min_particles: 100            # Parçacık sayısı, biraz arttırdım daha stabil pozisyon için
    max_particles: 3000
    resample_interval: 3
    pf_err: 0.03                 # Daha hassas hata toleransı
    pf_z: 0.99                   # Güven seviyesi yüksek
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    ### Güncelleme eşikleri ###
    update_min_d: 0.20            # 20 cm hareketten sonra güncelle
    update_min_a: 0.15            # 8.5° dönüşten sonra güncelle
    set_initial_pose: false
    always_reset_initial_pose: false

    ### Diğer ###
    save_pose_rate: 0.05



