ekf_localization_node:
  ros__parameters:
    use_sim_time: false

    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    print_diagnostics: true

    # LIO-SAM ODOMETRY
    odom0: /lio_sam/mapping/odometry
    odom0_config: [
      true,  true,  false,
      false, false, false,
      false,  false,  false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: true
    odom0_relative: true
    odom0_queue_size: 20
    odom0_rejection_threshold: 5.0
    
    
    # LIO-SAM ODOMETRY
    odom2: /pcl_pose
    odom2_config: [
      true,  true,  false,
      false, false, false,
      false,  false,  false,
      false, false, false,
      false, false, false
    ]
    odom2_differential: false
    odom2_relative: false
    odom2_queue_size: 20
    odom2_rejection_threshold: 5.0    

    # IMU - SADECE YAW
    imu0: /imu/data
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: true
    imu0_pose_rejection_threshold: 1.0
    imu0_twist_rejection_threshold: 1.0
    imu0_linear_acceleration_rejection_threshold: 1.0

    # GPS ODOMETRY
    odom1: /odometry/gps
    odom1_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
    odom1_rejection_threshold: 5.0


navsat_transform_node:
  ros__parameters:
    use_sim_time: false

    frequency: 30.0
    delay: 3.0

    magnetic_declination_radians: 0.0
    yaw_offset: 0.0

    zero_altitude: true
    broadcast_utm_transform: false
    broadcast_utm_transform_as_parent_frame: false
    publish_filtered_gps: true

    use_odometry_yaw: false
    wait_for_datum: false

    base_link_frame: base_footprint
    world_frame: map
