ekf_localization_node:
  ros__parameters:
    use_sim_time: false

    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    print_diagnostics: true

    # LIO-SAM POSE
    odom0: /lio_sam/mapping/odometry
    odom0_config: [
      true,  true,  false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_rejection_threshold: 5.0

    # WHEEL ENCODER / TEKER ODOM
    odom1: /teker
    odom1_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
    odom1_rejection_threshold: 1.0

    # GPS FROM NAVSAT_TRANSFORM
    odom2: /odometry/gps
    odom2_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom2_differential: false
    odom2_relative: false
    odom2_queue_size: 10
    odom2_rejection_threshold: 10.0

    # IMU
    imu0: /imu/data
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_rejection_threshold: 5.0
    imu0_remove_gravitational_acceleration: true


navsat_transform_node:
  ros__parameters:
    use_sim_time: false

    frequency: 10.0
    delay: 3.0

    magnetic_declination_radians: 0.0
    yaw_offset: 0.0

    zero_altitude: true
    broadcast_utm_transform: false
    broadcast_utm_transform_as_parent_frame: false
    publish_filtered_gps: true

    use_odometry_yaw: false
    wait_for_datum: false

    base_link_frame: base_footprint
    world_frame: map
