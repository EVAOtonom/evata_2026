rslidar_odometry:
  ros__parameters:
    # Point cloud preprocessing
    voxel_leaf_size: 0.1
    min_scan_range: 0.5
    max_scan_range: 100.0
    
    # ICP parameters
    max_correspondence_distance: 1.0
    max_iterations: 30
    transformation_epsilon: 1.0e-6
    euclidean_fitness_epsilon: 1.0e-6
    
    # Frame IDs
    odom_frame: "odom"
    base_frame: "base_footprint"
    lidar_frame: "rslidar"
    
    # Publishing options
    publish_tf: true
