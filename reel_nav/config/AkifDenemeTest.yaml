controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0
    goal_checker_plugins: ["general_goal_checker"]
    use_collision_checker: true
    progress_checker.movement_time_allowance: 50.0
    progress_checker.required_movement_radius: 0.001
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.7
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # ---- Temel hiz limitleri (cmd_vel.py'deki max_velocity=0.8 ve
      # angular_z_max/min=+-0.35 ile TUTARLI tutuldu; RPP'nin ciktisi zaten
      # cmd_vel_subscriber icinde tekrar clamp'leniyor, bu yuzden burada asiri
      # gitmeye gerek yok - araci gercekten surecek guvenli tavan secildi) ----
      desired_linear_vel: 0.6
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true

      # ---- Lookahead (carrot) ayari ----
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.2
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_interpolation: true
      max_robot_pose_search_dist: 5.0

      # ---- Ackermann araç: yerinde donus yok, keskin donuslerde hiz kismasi RPP'nin
      # kendi mekanizmasiyla (regulated scaling) yapiliyor, ekstra
      # AckermannConstraints yok cunku RPP bunu desteklemiyor; fiziksel donus yaricapi
      # limiti planner_server.minimum_turning_radius (1.5 m) ile zaten garanti altinda,
      # regulated_linear_scaling_min_radius da ayni degerle eslendi. ----
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.25

      # ---- Costmap'e gore ek hiz kismasi: kapalı, cunku CostCritic zaten
      # controller_server seviyesinde yok (RPP ayri calisir); acmak istersen
      # true yapip cost_scaling_dist/gain degerlerini ayarla. ----
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.2

      transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      footprint: "[[1.35, 0.775], [1.35, -0.775], [-1.35, -0.775], [-1.35, 0.775]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.2
        inflation_radius: 1.5
        always_send_full_costmap: False
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 20
        max_obstacle_height: 0.3
        mark_threshold: 0
        observation_sources: scan lane_pointcloud sign_obstacles
        scan:
          topic: /rslidar_points
          max_obstacle_height: 0.3
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 14.5
          obstacle_min_range: 0.0
          observation_persistence: 6.0


        lane_pointcloud:
          topic: /lane_pointcloud
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.5
          obstacle_min_range: 0.0
          observation_persistence: 20.0

        sign_obstacles:
          topic: /sign_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0          

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      footprint: "[[1.35, 0.775], [1.35, -0.775], [-1.35, -0.775], [-1.35, 0.775]]"
      resolution: 0.1
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan lane_pointcloud sign_obstacles_global
        scan:
          topic: /rslidar_points
          max_obstacle_height: 0.3
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 14.5
          obstacle_min_range: 0.0
          observation_persistence: 6.0

        lane_pointcloud:
          topic: /lane_pointcloud
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.5
          obstacle_min_range: 0.0
          observation_persistence: 20.0

        sign_obstacles_global:
          topic: /sign_obstacles_global
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.2
        inflation_radius: 1.5
        always_send_full_costmap: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: -1
      max_on_approach_iterations: 10
      max_planning_time: 10.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 1.5   # Dogrulandi: wheelbase=1.0m ile gercek max tekerlek acisi ~21.8 dereceye denk gelir
      reverse_penalty: 31.0
      change_penalty: 0.0
      # 1.0 -> 1.3: Hybrid A*'in duz-degil (donen) hareket primitiflerine biraz daha
      # fazla maliyet vermesini sagliyor. Bu, path'in gereksiz yere zigzag/mikro-donus
      # yapmasini azaltir (daha az "sarsinti"), ama minimum_turning_radius ayri bir
      # sert kisit oldugu icin gercekten gereken keskin donuslerde path yine dogru
      # yaricapi kullanir - bu param sadece "gereksiz" donusleri cezalandirir.
      non_straight_penalty: 5.0
      cost_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      goal_heading_mode: "DEFAULT"

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
