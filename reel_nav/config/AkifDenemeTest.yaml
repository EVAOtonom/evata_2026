robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200  # ms cinsinden bekleme süresi

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.7, 0.0, 0.40]
    min_velocity: [-0.2, 0.0, -0.40]
    # max_accel/max_decel'in 3. elemani (z/angular): 0.5 -> 1.0 rad/s^2.
    # Eskisiyle 0'dan wz_max=0.35'e ulasmak ~0.7s suruyordu - MPPI "tam kirin"
    # dese bile fiziksel komut gecikmeli/yumusatilarak geliyordu, bu da donuslerde
    # "cekingen" bir his yaratiyordu. 1.0 ile bu sure ~0.35s'ye iniyor: hala ani
    # sicramayi (jerk) engelleyen bir rampa var, ama MPPI'nin kararli donus
    # komutuna cok daha hizli ulasiliyor. Linear (1. eleman) degismedi.
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0