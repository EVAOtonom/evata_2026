/**:
  ros__parameters:
    registration_method: "NDT_OMP"

    score_threshold: 2.0

    ndt_resolution: 1.0
    ndt_step_size: 0.1
    ndt_num_threads: 4
    ndt_max_iterations: 35
    transform_epsilon: 0.01

    voxel_leaf_size: 0.2

    scan_max_range: 150.0
    scan_min_range: 3.0
    scan_period: 0.1

    use_pcd_map: true
    map_path: "/home/oguzcan/real_ws/map.pcd"

    # İlk pose'u dışarıdan /initialpose veya GPS tabanlı node ile vereceksen false kalabilir.
    # Ama localizer kendi başına ilk poz alsın istiyorsan true yapılır.
    set_initial_pose: true

    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0

    use_odom: true
    use_imu: true

    enable_debug: true

    # map->odom TF'yi bu paket yayınlayacaksa true yap.
    # Başka node yayınlıyorsa false kalsın.
    enable_map_odom_tf: false

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint

    enable_timer_publishing: false
    pose_publish_frequency: 30.0
