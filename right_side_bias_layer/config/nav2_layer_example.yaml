# Copy the right_side_bias section into both global_costmap and local_costmap.
# Parameter tuning will be performed in the next step.
global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "obstacle_layer", "right_side_bias", "inflation_layer"]
      right_side_bias:
        plugin: "right_side_bias_layer::RightSideBiasLayer"
        enabled: true
        csv_path: "/ABSOLUTE/PATH/TO/centerline.csv"
        invert_side: false
        influence_distance: 4.0
        preferred_right_offset: 0.9
        right_sigma: 0.75
        center_cost: 70.0
        left_gain: 170.0
        left_sigma: 1.2
        minimum_cost: 0
        maximum_cost: 252
